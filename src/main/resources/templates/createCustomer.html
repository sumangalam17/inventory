<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::content})}">
<head>
	<title>Create customer | Bhagwani Hardware</title>
</head>
<body>
	<section th:fragment="content" class="mx-auto max-w-3xl">
		<div class="mb-7">
			<a th:href="@{/customers}" class="text-sm font-medium text-blue-700 hover:underline dark:text-blue-400">&larr; Customers</a>
			<h1 class="mt-3 text-3xl font-bold text-gray-900 dark:text-white">Create customer</h1>
			<p class="mt-2 text-gray-600 dark:text-gray-400">Save customer contact details for bills and payments.</p>
		</div>

		<form th:action="@{/customer/create}" method="post"
			  class="space-y-6 rounded-lg border border-gray-200 bg-white p-6 dark:border-gray-700 dark:bg-gray-800">
			<div class="grid gap-5 sm:grid-cols-2">
				<div>
					<label for="name" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Customer name <span aria-hidden="true">*</span></label>
					<input id="name" name="name" type="text" required maxlength="120" autocomplete="name"
						   class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
						   placeholder="e.g. Rahul Sharma">
				</div>
				<div>
					<label for="mobileNo" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Mobile number <span aria-hidden="true">*</span></label>
					<input id="mobileNo" name="mobileNo" type="tel" required maxlength="20" autocomplete="tel"
						   class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
						   placeholder="e.g. 9876543210">
				</div>
				<div class="sm:col-span-2">
					<label for="address" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Address <span class="font-normal text-gray-500 dark:text-gray-400">(optional)</span></label>
					<textarea id="address" name="address" rows="3" maxlength="500" autocomplete="street-address"
							  class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
							  placeholder="Street, area, city"></textarea>
				</div>
			</div>

			<div class="flex flex-wrap justify-end gap-3 border-t border-gray-200 pt-5 dark:border-gray-700">
				<a th:href="@{/customers}" class="rounded-md border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">Cancel</a>
				<button type="submit" class="inline-flex items-center gap-2 rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-900">
					<i class="fa-solid fa-user-plus" aria-hidden="true"></i>
					Create customer
				</button>
			</div>
		</form>
	</section>
</body>
</html>
