<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::content})}">
<head>
	<title>Edit inventory item | Bhagwani Hardware</title>
</head>
<body>
	<section th:fragment="content">
		<div class="mx-auto max-w-2xl">
			<div>
				<h1 class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">Edit inventory item</h1>
				<p class="mt-2 text-gray-600 dark:text-gray-400">Update prices and stock settings. Product name, brand, and size stay unchanged to preserve transaction references.</p>
			</div>

			<form th:action="@{/inventory/edit}" method="post" class="mt-8 space-y-6 rounded-lg border border-gray-200 bg-white p-6 dark:border-gray-700 dark:bg-gray-800">
				<input type="hidden" name="itemId" th:value="${item.itemId}">
				<div>
					<p class="text-sm font-medium text-gray-500 dark:text-gray-400">Product</p>
					<p class="mt-1 font-semibold text-gray-900 dark:text-white" th:text="${item.name}">Product name</p>
					<p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
						<span th:text="${item.brand}">Brand</span>
						<span th:if="${!#strings.isEmpty(item.size)}" th:text="| · ${item.size}|"> · Size</span>
					</p>
				</div>

				<div class="grid gap-5 sm:grid-cols-2">
					<div>
						<label for="costPrice" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Cost price <span aria-hidden="true">*</span></label>
						<input id="costPrice" name="costPrice" type="number" min="0" step="0.01" required th:value="${item.costPrice}" class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white">
					</div>
					<div>
						<label for="price" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Selling price <span class="font-normal text-gray-500">(optional)</span></label>
						<input id="price" name="price" type="number" min="0" step="0.01" th:value="${item.price}" class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white">
					</div>
					<div>
						<label for="count" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Quantity on hand <span aria-hidden="true">*</span></label>
						<input id="count" name="count" type="number" min="0" step="1" required th:value="${item.count}" class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white">
					</div>
					<div>
						<label for="lowStock" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Low-stock threshold <span aria-hidden="true">*</span></label>
						<input id="lowStock" name="lowStock" type="number" min="1" step="1" required th:value="${item.lowStock}" class="block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-600 focus:ring-blue-600 dark:border-gray-600 dark:bg-gray-700 dark:text-white">
					</div>
				</div>
				<div class="flex flex-wrap justify-end gap-3">
					<a th:href="@{/inventory}" class="rounded-md border border-gray-300 px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-700">Cancel</a>
					<button type="submit" class="rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-900">Save changes</button>
				</div>
			</form>
		</div>
	</section>
</body>
</html>
