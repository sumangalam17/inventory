<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{base :: parent(~{::content})}">
<head>
	<title>Transactions | Bhagwani Hardware</title>
</head>
<body>
	<section th:fragment="content" class="mx-auto max-w-7xl">
		<div class="flex flex-wrap items-end justify-between gap-4">
			<div>
				<h1 class="text-3xl font-bold text-gray-900 dark:text-white"
					th:text="${billListType == 'sale' ? 'Sale bills' : (billListType == 'return' ? 'Return bills' : 'All bills')}">Transactions</h1>
				<p class="mt-2 text-gray-600 dark:text-gray-400"
				   th:text="${dateRangeSelected ? (billListType == 'return' ? 'Return bills from ' : 'Bills from ') + #temporals.format(fromDate, 'dd MMM yyyy') + ' through ' + #temporals.format(toDate, 'dd MMM yyyy') : 'Showing all dates.'}">Showing all dates.</p>
			</div>
			<div class="flex flex-wrap items-center gap-3">
				<a th:href="@{/bill/report/date-range/pdf(fromDate=${transactionReportFromDate},toDate=${transactionReportToDate})}"
				   class="rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800">
					Download report
				</a>
				<a th:href="@{/bill/create}" class="rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800">Create bill</a>
			</div>
		</div>
		
		<section class="mt-8 overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
			<div class="grid gap-4 border-b border-gray-200 bg-gray-50 p-5 sm:grid-cols-2 dark:border-gray-700 dark:bg-gray-800">
				<div class="rounded-md bg-green-50 p-4 dark:bg-green-950">
					<p class="text-sm font-medium text-green-800 dark:text-green-300">Total credit</p>
					<p class="mt-1 text-xl font-semibold text-green-700 dark:text-green-400"
					   th:text="${#numbers.formatDecimal(transactionCreditTotal, 1, 2)}">0.00</p>
				</div>
				<div class="rounded-md bg-red-50 p-4 dark:bg-red-950">
					<p class="text-sm font-medium text-red-800 dark:text-red-300">Total debit</p>
					<p class="mt-1 text-xl font-semibold text-red-700 dark:text-red-400"
					   th:text="${#numbers.formatDecimal(transactionDebitTotal, 1, 2)}">0.00</p>
				</div>
			</div>
			<table class="w-full text-left text-sm text-gray-600 dark:text-gray-300">
				<thead class="bg-gray-50 text-xs uppercase text-gray-700 dark:bg-gray-700 dark:text-gray-300">
					<tr>
						<th scope="col" class="px-5 py-3">Type</th>
						<th scope="col" class="px-5 py-3">Date / time</th>
						<th scope="col" class="px-5 py-3">Customer</th>
						<th scope="col" class="px-5 py-3">Customer ID</th>
						<th scope="col" class="px-5 py-3">Bill number</th>
						<th scope="col" class="px-5 py-3 text-right">Credit</th>
						<th scope="col" class="px-5 py-3 text-right">Debit</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${#lists.isEmpty(transactions)}">
						<td colspan="7" class="px-5 py-10 text-center">No transactions were recorded during this period.</td>
					</tr>
					<tr th:each="transaction : ${transactions}" class="border-t border-gray-200 dark:border-gray-700">
						<td class="px-5 py-4 font-medium text-gray-900 dark:text-white"
							th:text="${transaction.transactionType != null and transaction.transactionType.name() == 'itemReturn' ? 'Return' : transaction.transactionType}">sale</td>
						<td class="px-5 py-4"
							th:text="${transaction.creatDate != null ? #dates.format(transaction.creatDate, 'dd MMM yyyy, HH:mm:ss') : ''}">Date</td>
						<td class="px-5 py-4" th:text="${customerNames[transaction.customerID] ?: 'Unknown customer'}">Customer</td>
						<td class="px-5 py-4 font-mono text-xs"
							th:text="${transaction.customerID != null ? transaction.customerID : '-'}">Customer ID</td>
						<td class="px-5 py-4 font-mono text-xs"
							th:text="${transaction.billNo != null ? transaction.billNo : '-'}">-</td>
						<td class="px-5 py-4 text-right font-medium text-green-700 dark:text-green-400"
							th:text="${transaction.transactionType != null and (transaction.transactionType.name() == 'recieved' or transaction.transactionType.name() == 'itemReturn') ? #numbers.formatDecimal(transaction.amount, 1, 2) : '-'}">-</td>
						<td class="px-5 py-4 text-right font-medium text-red-700 dark:text-red-400"
							th:text="${transaction.transactionType != null and (transaction.transactionType.name() == 'sale' or transaction.transactionType.name() == 'refund') ? #numbers.formatDecimal(transaction.amount, 1, 2) : '-'}">-</td>
					</tr>
				</tbody>
			</table>
		</section>
	</section>
</body>
</html>
