<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::content})}">
<head>
    <title>Customers | Bhagwani Hardware</title>
</head>
<body>
    <section th:fragment="content">
        <div class="flex flex-wrap items-end justify-between gap-5">
            <div>
                <h1 class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">Customer list</h1>
                <p class="mt-2 text-gray-600 dark:text-gray-400">All saved customers and their contact details.</p>
            </div>
            <a th:href="@{/customer/create}" class="inline-flex items-center gap-2 rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-900">
                <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                Create customer
            </a>
        </div>

        <section class="mt-8 overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 px-5 py-4 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Customers</h2>
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    <span th:text="${#lists.size(customers)}">0</span> total
                </p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600 dark:text-gray-300">
                    <thead class="bg-gray-50 text-xs uppercase text-gray-700 dark:bg-gray-700 dark:text-gray-300">
                        <tr>
                            <th scope="col" class="px-5 py-3">Name</th>
                            <th scope="col" class="px-5 py-3">Mobile</th>
                            <th scope="col" class="px-5 py-3">Address</th>
                            <th scope="col" class="px-5 py-3">Amount Paid</th>
                            <th scope="col" class="px-5 py-3">Amount Pending</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(customers)}">
                            <td colspan="5" class="px-5 py-12 text-center">
                                <p class="font-semibold text-gray-900 dark:text-white">No customers yet</p>
                                <p class="mt-1">Customer details will appear here after a sale is created.</p>
                            </td>
                        </tr>

                        <tr th:each="customer : ${customers}" class="border-t border-gray-200 dark:border-gray-700">
                            <td class="px-5 py-4 font-semibold text-gray-900 dark:text-white" th:text="${customer.name}">Customer Name</td>
                            <td class="px-5 py-4" th:text="${customer.mobileNo}">9876543210</td>
                            <td class="px-5 py-4" th:text="${customer.address != null ? customer.address : 'N/A'}">Address</td>
                            <td class="px-5 py-4" th:text="${customer.amountPaid}">0</td>
                            <td class="px-5 py-4" th:text="${customer.amountPending}">0</td>
                            <td class="px-5 py-4">
                                <a th:href="@{/customer/{mobileNo}(mobileNo=${customer.mobileNo})}"
                                   class="inline-flex items-center rounded-md bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700">
                                    View
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</body>
</html>
